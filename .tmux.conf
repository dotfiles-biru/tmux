# General

## Prefix
set -g prefix C-b
bind C-b send-prefix

## Mouse support
set -g mouse on

## Start window/pane numbering from 1
set -g base-index 1
setw -g pane-base-index 1

## Automatically renumber windows
set -g renumber-windows on


# Splitting

## Split horizontally
bind | split-window -h

## Split vertically
bind - split-window -v

## Keep current directory when splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# Navigation

## Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# Reload config
bind r source-file ~/.config/tmux/.tmux.conf \; display-message "tmux config reloaded"

# Sora theme for tmux
# source-file ~/.config/tmux/sora.tmux.conf

## Status bar
set -g status-style "bg=default fg=#c8d0e0"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 200

set -g status-left "#[fg=#80c8e0,bold] #{session_name}  "
set -g status-right "#[fg=#586478]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD) "

## Window status
set -g window-status-format "#[fg=#586478]#{window_index}:#{window_name}#{window_flags} "
set -g window-status-current-format "#[fg=#80c8e0,bold]#{window_index}:#{window_name}#{window_flags} "
set -g window-status-last-style "fg=#9aa4b8"
set -g window-status-activity-style "fg=#d4b878"

## Pane borders
set -g pane-border-style "fg=#364050"
set -g pane-active-border-style "fg=#80c8e0"

## Messages
set -g message-style "bg=#14161e fg=#c8d0e0"
set -g message-command-style "bg=#14161e fg=#c8d0e0"

## Selection / copy mode
set -g mode-style "bg=#1e2430 fg=#dce4f0"

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @tokyo-night-tmux_theme 'sora'

run '~/.tmux/plugins/tpm/tpm'
